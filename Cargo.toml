[package]
name = "s3rsync"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "rsync for S3-compatible object storage: a fast, concurrent, streaming bucket-to-bucket copier in Rust."
authors = ["Luccin Masirika"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/luccinmasirika/s3rsync"
homepage = "https://github.com/luccinmasirika/s3rsync"
readme = "README.md"
keywords = ["s3", "minio", "migration", "object-storage", "rsync"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "s3rsync"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "io-util"] }
futures = "0.3"
async-channel = "2"

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-credential-types = "1"
aws-smithy-types = "1"

clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
anyhow = "1"
humansize = "2"
glob = "0.3"
base64 = "0.22"

# Light-on-RAM release profile (compiles on small VMs); runtime cost is
# negligible for an I/O-bound network tool.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true
panic = "abort"
